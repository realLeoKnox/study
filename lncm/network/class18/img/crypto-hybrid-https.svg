<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img">
  <defs>
    <marker id="cr-a" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#176779"/>
    </marker>
    <marker id="cr-r" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b44032"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#ffffff"/>

  <!-- Row 1: Symmetric -->
  <rect x="14" y="12" width="126" height="58" rx="5" fill="#edf4f5" stroke="#176779" stroke-width="1.4"/>
  <text x="77" y="36" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="700" fill="#176779">对称加密</text>
  <text x="77" y="55" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#51626c">快 · 同密钥 K</text>

  <rect x="156" y="22" width="90" height="38" rx="4" fill="#f8fafb" stroke="#94b2ba"/>
  <text x="201" y="46" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#20323b">明文</text>

  <path d="M246 41 L286 41" fill="none" stroke="#176779" stroke-width="1.7" marker-end="url(#cr-a)"/>
  <rect x="290" y="18" width="120" height="46" rx="4" fill="#edf4f5" stroke="#176779"/>
  <text x="350" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#176779">密钥 K 加密</text>
  <text x="350" y="55" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#51626c">AES / ChaCha20</text>

  <path d="M410 41 L460 41" fill="none" stroke="#176779" stroke-width="1.7" marker-end="url(#cr-a)"/>
  <text x="435" y="34" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#51626c">密文</text>

  <rect x="464" y="18" width="120" height="46" rx="4" fill="#edf4f5" stroke="#176779"/>
  <text x="524" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#176779">同一密钥 K 解密</text>
  <text x="524" y="55" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#8f2d21">难点：如何安全送 K</text>

  <path d="M584 41 L618 41" fill="none" stroke="#176779" stroke-width="1.7" marker-end="url(#cr-a)"/>
  <rect x="622" y="22" width="84" height="38" rx="4" fill="#f8fafb" stroke="#94b2ba"/>
  <text x="664" y="46" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#20323b">明文</text>

  <line x1="14" y1="80" x2="706" y2="80" stroke="#dde6e8"/>

  <!-- Row 2: Asymmetric -->
  <rect x="14" y="90" width="126" height="58" rx="5" fill="#fdf2f0" stroke="#b44032" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="77" y="114" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="700" fill="#8f2d21">非对称加密</text>
  <text x="77" y="133" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#8f2d21">慢 · 公钥/私钥对</text>

  <rect x="156" y="100" width="90" height="38" rx="4" fill="#f8fafb" stroke="#94b2ba"/>
  <text x="201" y="124" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#20323b">短数据/密钥</text>

  <path d="M246 119 L286 119" fill="none" stroke="#b44032" stroke-width="1.7" marker-end="url(#cr-r)"/>
  <rect x="290" y="96" width="120" height="46" rx="4" fill="#fdf2f0" stroke="#b44032" stroke-dasharray="4 3"/>
  <text x="350" y="116" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#8f2d21">对方公钥加密</text>
  <text x="350" y="133" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#51626c">公钥可公开传输</text>

  <path d="M410 119 L460 119" fill="none" stroke="#b44032" stroke-width="1.7" marker-end="url(#cr-r)"/>
  <text x="435" y="112" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#51626c">密文</text>

  <rect x="464" y="96" width="120" height="46" rx="4" fill="#fdf2f0" stroke="#b44032" stroke-dasharray="4 3"/>
  <text x="524" y="116" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#8f2d21">对方私钥解密</text>
  <text x="524" y="133" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#51626c">RSA / ECC，私钥保密</text>

  <path d="M584 119 L618 119" fill="none" stroke="#b44032" stroke-width="1.7" marker-end="url(#cr-r)"/>
  <rect x="622" y="100" width="84" height="38" rx="4" fill="#f8fafb" stroke="#94b2ba"/>
  <text x="664" y="124" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#20323b">还原</text>

  <line x1="14" y1="158" x2="706" y2="158" stroke="#94b2ba" stroke-width="1.2"/>

  <!-- Row 3: Hybrid HTTPS -->
  <rect x="14" y="168" width="692" height="90" rx="6" fill="#f4f8f9" stroke="#176779" stroke-width="1.5"/>
  <text x="360" y="189" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="700" fill="#176779">实际应用：HTTPS（TLS）混合加密 —— 取两者之长</text>

  <rect x="28" y="200" width="302" height="46" rx="5" fill="#ffffff" stroke="#b44032" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="179" y="219" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#8f2d21">① 握手阶段：非对称体系（RSA / ECDHE）</text>
  <text x="179" y="237" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#20323b">验证证书身份 + 安全协商本次会话对称密钥 K</text>

  <path d="M332 223 L384 223" fill="none" stroke="#176779" stroke-width="2" marker-end="url(#cr-a)"/>
  <text x="358" y="215" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#176779">商定 K</text>

  <rect x="388" y="200" width="304" height="46" rx="5" fill="#ffffff" stroke="#176779" stroke-width="1.4"/>
  <text x="540" y="219" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#176779">② 数据传输阶段：对称加密（AES-GCM 等）</text>
  <text x="540" y="237" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#20323b">用临时会话密钥 K 高速加解密全部网页正文与表单</text>
</svg>
