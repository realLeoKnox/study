<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 285" width="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect width="680" height="285" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><text x="20" y="20" font-size="14" fill="#176779" text-anchor="start" font-weight="700" dominant-baseline="central">X.25：逐跳确认、逐跳重传</text><rect x="20" y="36" width="130" height="56" rx="6" fill="#ffffff" stroke="#c6d4d8" stroke-width="1.2"/><text x="85" y="56" font-size="13.5" fill="#202a35" text-anchor="middle" font-weight="700" dominant-baseline="central">主机 A</text><text x="85" y="76" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">发送</text><rect x="190" y="36" width="130" height="56" rx="6" fill="#edf4f5" stroke="#176779" stroke-width="1.2"/><text x="255" y="56" font-size="13.5" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">节点 1</text><text x="255" y="76" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">检错 纠错 确认</text><rect x="360" y="36" width="130" height="56" rx="6" fill="#edf4f5" stroke="#176779" stroke-width="1.2"/><text x="425" y="56" font-size="13.5" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">节点 2</text><text x="425" y="76" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">检错 纠错 确认</text><rect x="530" y="36" width="130" height="56" rx="6" fill="#ffffff" stroke="#c6d4d8" stroke-width="1.2"/><text x="595" y="56" font-size="13.5" fill="#202a35" text-anchor="middle" font-weight="700" dominant-baseline="central">主机 B</text><text x="595" y="76" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">接收</text><line x1="153" y1="52" x2="186" y2="52" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><line x1="187" y1="78" x2="154" y2="78" stroke="#c0562f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="323" y1="52" x2="356" y2="52" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><line x1="357" y1="78" x2="324" y2="78" stroke="#c0562f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="493" y1="52" x2="526" y2="52" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><line x1="527" y1="78" x2="494" y2="78" stroke="#c0562f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="340" y="112" font-size="12" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">每一跳：收齐 → 校验 → 回 ACK（虚线）→ 留副本 → 转发</text><text x="20" y="150" font-size="14" fill="#176779" text-anchor="start" font-weight="700" dominant-baseline="central">帧中继：中间只检错，错了直接丢</text><rect x="20" y="166" width="130" height="56" rx="6" fill="#ffffff" stroke="#c6d4d8" stroke-width="1.2"/><text x="85" y="186" font-size="13.5" fill="#202a35" text-anchor="middle" font-weight="700" dominant-baseline="central">主机 A</text><text x="85" y="206" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">发送</text><rect x="190" y="166" width="130" height="56" rx="6" fill="#edf4f5" stroke="#176779" stroke-width="1.2"/><text x="255" y="186" font-size="13.5" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">节点 1</text><text x="255" y="206" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">查 DLCI 转发</text><rect x="360" y="166" width="130" height="56" rx="6" fill="#edf4f5" stroke="#176779" stroke-width="1.2"/><text x="425" y="186" font-size="13.5" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">节点 2</text><text x="425" y="206" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">查 DLCI 转发</text><rect x="530" y="166" width="130" height="56" rx="6" fill="#ffffff" stroke="#c6d4d8" stroke-width="1.2"/><text x="595" y="186" font-size="13.5" fill="#202a35" text-anchor="middle" font-weight="700" dominant-baseline="central">主机 B</text><text x="595" y="206" font-size="11" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">接收</text><line x1="153" y1="182" x2="186" y2="182" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><line x1="323" y1="182" x2="356" y2="182" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><line x1="493" y1="182" x2="526" y2="182" stroke="#202a35" stroke-width="1.5" marker-end="url(#a)"/><path d="M595 222 V246 H85 V226" fill="none" stroke="#176779" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="340" y="264" font-size="12" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">确认和重传交给两端主机的 TCP（端到端虚线）</text></svg>