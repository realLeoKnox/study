<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect width="680" height="302" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="70" y="10" width="160" height="38" rx="6" fill="#edf4f5" stroke="#176779"/><text x="150" y="29" font-size="14" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">PC1</text><rect x="450" y="10" width="160" height="38" rx="6" fill="#edf4f5" stroke="#176779"/><text x="530" y="29" font-size="14" fill="#176779" text-anchor="middle" font-weight="700" dominant-baseline="central">PC2</text><line x1="150" y1="48" x2="150" y2="262" stroke="#c6d4d8" stroke-dasharray="4 3"/><line x1="530" y1="48" x2="530" y2="262" stroke="#c6d4d8" stroke-dasharray="4 3"/><line x1="154" y1="80" x2="524" y2="80" stroke="#8b6a32" stroke-width="1.8" marker-end="url(#a)"/><text x="340.0" y="67" font-size="12.5" fill="#8b6a32" text-anchor="middle" font-weight="400" dominant-baseline="central">ARP 请求（广播）：谁是 PC2 的 IP？</text><line x1="526" y1="128" x2="156" y2="128" stroke="#8b6a32" stroke-width="1.8" marker-end="url(#a)"/><text x="340.0" y="115" font-size="12.5" fill="#8b6a32" text-anchor="middle" font-weight="400" dominant-baseline="central">ARP 应答（单播）：我的 MAC 是……</text><line x1="154" y1="176" x2="524" y2="176" stroke="#176779" stroke-width="1.8" marker-end="url(#a)"/><text x="340.0" y="163" font-size="12.5" fill="#176779" text-anchor="middle" font-weight="400" dominant-baseline="central">ICMP Echo Request（Type 8）</text><line x1="526" y1="224" x2="156" y2="224" stroke="#176779" stroke-width="1.8" marker-end="url(#a)"/><text x="340.0" y="211" font-size="12.5" fill="#176779" text-anchor="middle" font-weight="400" dominant-baseline="central">ICMP Echo Reply（Type 0）</text><text x="340.0" y="284" font-size="12" fill="#6d747b" text-anchor="middle" font-weight="400" dominant-baseline="central">先 ARP 拿到对方 MAC，再发 ICMP；封装：Ethernet II → IPv4 → ICMP</text></svg>