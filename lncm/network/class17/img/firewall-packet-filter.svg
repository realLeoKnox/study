<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img">
  <defs>
    <marker id="fw-a" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#176779"/>
    </marker>
    <marker id="fw-r" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b44032"/>
    </marker>
  </defs>
  <rect width="720" height="256" fill="#ffffff"/>

  <!-- Left: Incoming Packet -->
  <rect x="14" y="40" width="154" height="146" rx="6" fill="#edf4f5" stroke="#176779" stroke-width="1.5"/>
  <text x="91" y="64" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#20323b">入站数据包</text>
  <line x1="26" y1="74" x2="156" y2="74" stroke="#b6c8cd"/>
  <text x="91" y="94" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#176779">提取五元组头部：</text>
  <text x="26" y="116" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#20323b">• 源 IP / 目的 IP</text>
  <text x="26" y="136" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#20323b">• 源端口 / 目的端口</text>
  <text x="24" y="156" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#20323b">• 协议：TCP/UDP/ICMP</text>
  <text x="91" y="176" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10.5" fill="#64727c">（不拆应用层正文）</text>

  <path d="M168 113 L200 113" fill="none" stroke="#176779" stroke-width="2" marker-end="url(#fw-a)"/>

  <!-- Middle: Firewall Rule Table (widened) -->
  <rect x="204" y="18" width="332" height="188" rx="6" fill="#f8fafb" stroke="#176779" stroke-width="1.7"/>
  <text x="370" y="41" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#176779">包过滤防火墙 · ACL 规则表（自上而下）</text>
  <line x1="216" y1="51" x2="524" y2="51" stroke="#c8d7dc"/>

  <!-- Rule 1 -->
  <rect x="216" y="61" width="308" height="36" rx="4" fill="#e6f2ef" stroke="#176779" stroke-width="1.2"/>
  <text x="226" y="84" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#20323b">规则 1：目的 TCP 443（HTTPS）</text>
  <rect x="454" y="68" width="62" height="22" rx="3" fill="#176779"/>
  <text x="485" y="83" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">ALLOW</text>

  <!-- Rule 2 -->
  <rect x="216" y="107" width="308" height="36" rx="4" fill="#fdf2f0" stroke="#b44032" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="226" y="130" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#20323b">规则 2：目的 TCP 23（Telnet）</text>
  <rect x="454" y="114" width="62" height="22" rx="3" fill="#b44032"/>
  <text x="485" y="129" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">DENY</text>

  <!-- Default Rule -->
  <rect x="216" y="153" width="308" height="36" rx="4" fill="#f1f3f4" stroke="#64727c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="226" y="176" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#20323b">兜底规则：其余未命中流量</text>
  <rect x="454" y="160" width="62" height="22" rx="3" fill="#64727c"/>
  <text x="485" y="175" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#ffffff">默认拒绝</text>

  <!-- Right outcomes -->
  <path d="M536 79 L572 79" fill="none" stroke="#176779" stroke-width="2" marker-end="url(#fw-a)"/>
  <rect x="576" y="53" width="130" height="52" rx="6" fill="#e6f2ef" stroke="#176779" stroke-width="1.5"/>
  <text x="641" y="76" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="700" fill="#176779">放行（Forward）</text>
  <text x="641" y="95" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#20323b">进入受保护内网</text>

  <path d="M536 147 L572 147" fill="none" stroke="#b44032" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#fw-r)"/>
  <rect x="576" y="121" width="130" height="52" rx="6" fill="#fdf2f0" stroke="#b44032" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="641" y="144" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="700" fill="#8f2d21">丢弃（Drop）</text>
  <text x="641" y="163" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#8f2d21">记录审计日志</text>

  <!-- Footer note -->
  <text x="360" y="236" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#51626c">说明：状态检测防火墙在查规则表前先查动态会话表（已建连接的合法回包直接放行）；应用代理型则拆包细查应用层</text>
</svg>
