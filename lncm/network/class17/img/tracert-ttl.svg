<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" role="img">
  <defs>
    <marker id="tr-a" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#176779"/>
    </marker>
    <marker id="tr-r" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b44032"/>
    </marker>
  </defs>
  <rect width="720" height="276" fill="#ffffff"/>

  <!-- 4 Nodes -->
  <rect x="20" y="14" width="118" height="38" rx="5" fill="#edf4f5" stroke="#176779" stroke-width="1.5"/>
  <text x="79" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#20323b">源主机</text>

  <rect x="208" y="14" width="118" height="38" rx="5" fill="#edf4f5" stroke="#94b2ba" stroke-width="1.4"/>
  <text x="267" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#20323b">路由器 R1</text>

  <rect x="396" y="14" width="118" height="38" rx="5" fill="#edf4f5" stroke="#94b2ba" stroke-width="1.4"/>
  <text x="455" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#20323b">路由器 R2</text>

  <rect x="582" y="14" width="118" height="38" rx="5" fill="#edf4f5" stroke="#176779" stroke-width="1.5"/>
  <text x="641" y="38" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#20323b">目标主机</text>

  <!-- Lifelines -->
  <line x1="79" y1="52" x2="79" y2="238" stroke="#b6c8cd" stroke-dasharray="4 4"/>
  <line x1="267" y1="52" x2="267" y2="238" stroke="#b6c8cd" stroke-dasharray="4 4"/>
  <line x1="455" y1="52" x2="455" y2="238" stroke="#b6c8cd" stroke-dasharray="4 4"/>
  <line x1="641" y1="52" x2="641" y2="238" stroke="#b6c8cd" stroke-dasharray="4 4"/>

  <!-- Round 1: TTL=1 -->
  <path d="M81 78 L263 78" fill="none" stroke="#176779" stroke-width="1.8" marker-end="url(#tr-a)"/>
  <text x="173" y="71" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176779">① 发包 TTL = 1</text>
  <rect x="275" y="66" width="84" height="22" rx="3" fill="#fdf2f0" stroke="#b44032" stroke-width="1"/>
  <text x="317" y="81" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700" fill="#8f2d21">TTL→0 丢弃</text>

  <path d="M265 102 L83 102" fill="none" stroke="#b44032" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#tr-r)"/>
  <rect x="96" y="88" width="154" height="13" fill="#ffffff"/>
  <text x="173" y="98" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#8f2d21">ICMP 超时 → 获 R1 IP</text>

  <!-- Round 2: TTL=2 -->
  <path d="M81 136 L451 136" fill="none" stroke="#176779" stroke-width="1.8" marker-end="url(#tr-a)"/>
  <rect x="130" y="119" width="110" height="16" fill="#ffffff"/>
  <text x="185" y="131" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176779">② 发包 TTL = 2</text>
  <rect x="314" y="119" width="90" height="16" fill="#ffffff"/>
  <text x="359" y="131" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#51626c">过 R1 剩 TTL=1</text>
  <rect x="463" y="124" width="84" height="22" rx="3" fill="#fdf2f0" stroke="#b44032" stroke-width="1"/>
  <text x="505" y="139" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700" fill="#8f2d21">TTL→0 丢弃</text>

  <path d="M453 160 L83 160" fill="none" stroke="#b44032" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#tr-r)"/>
  <rect x="184" y="146" width="182" height="13" fill="#ffffff"/>
  <text x="275" y="156" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#8f2d21">ICMP 超时（Type 11）→ 获 R2 IP</text>

  <!-- Round 3: TTL=3 -->
  <path d="M81 196 L637 196" fill="none" stroke="#176779" stroke-width="1.9" marker-end="url(#tr-a)"/>
  <rect x="130" y="179" width="110" height="16" fill="#ffffff"/>
  <text x="185" y="191" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176779">③ 发包 TTL = 3</text>
  <rect x="488" y="179" width="118" height="16" fill="#ffffff"/>
  <text x="547" y="191" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#176779">顺利抵达目标主机</text>

  <path d="M639 222 L83 222" fill="none" stroke="#176779" stroke-width="1.9" marker-end="url(#tr-a)"/>
  <rect x="132" y="207" width="460" height="14" fill="#ffffff"/>
  <text x="362" y="218" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700" fill="#176779">目标应答：Windows 回 Echo Reply；Linux/macOS 默认回 ICMP 端口不可达</text>

  <!-- Bottom note -->
  <text x="360" y="260" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#64727c">mtr 将 Ping 与 Traceroute 合二为一，持续发包统计每一跳的实时丢包率与延迟波动</text>
</svg>
