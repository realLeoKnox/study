<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
      div{
        float: left;
        width: 300px;
        height: 160px;
        background-color: #ff0000;
        margin: 10px;/*间距*/
        text-align: center;/*水平居中*/
        line-height: 160px;/*行高等于盒子高度，居中对齐*/
        font-size: 40px;/*文字大小*/
        color: #fff;
      }
      .r1{
        float: right;
      }
  </style>
</head>
<body>
  <p>这是三个块元素</p>
  <div>div</div>
  <div>div</div>
  <div class="r1">div</div>

  <p>这是三个行元素</p>
  <span>span</span>
  <span>span</span>
  <span>span</span>
</body>
</html>
