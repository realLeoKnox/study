<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Class 5</title>
    <style>
        table{
            border-collapse: collapse; /*从双实线变实线*/
            border: 1.5px solid black;
        }
        td{
            border: 1px solid #ff0000;
            width: 150px;
            height: 50px;
            text-align: center;
        }
        </style>
</head>

<body>
    <table>
        <caption>这是一个演示表格</caption>
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th></tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td></tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td></tr>
        <tr>
            <td>10</td>
            <td>11</td>
            <td>12</td></tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td></tr>
    </table>
    <hr>
    <table>
        <tr>
            <td colspan="2">1</td>
            <td>2</td>
<!--            <td>3</td></tr>-->
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td></tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td></tr>
        <tr>
            <td rowspan="2">10</td>
            <td>11</td>
            <td>12</td></tr>
        <tr>
            <td>13</td>
            <td>14</td>
<!--            <td>15</td></tr>-->
    </table>
</body>
</html>
