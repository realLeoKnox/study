<p>强劲的用户增长+强劲的折扣+升级的体系化力量，从这方面来说，阿里已远远超过了其他下沉市场参与者。</p>
<p>双十一到今年已经11岁了，2009年阿里把这个活动造出来的时候，并没有想到后来它会变成影响中国人购物习惯的全民购物节。</p>
<p class="last_cu">某种程度来说，双11已经不仅仅是一个节日，更多的是一种时尚文化的象征与代表。</p>
