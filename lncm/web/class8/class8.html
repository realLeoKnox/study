<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    form{
      width: 400px;
    }
  </style>
</head>
<body>
    <form action="">
      <fieldset>
        <legend>申请注册</legend>
        <!--table>tr*8>td*2-->
        <table>
          <tr>
            <td>请输入邮箱</td>
            <td><input type="email" placeholder="请输入邮箱地址" autofocus required></td>
          </tr>
          <tr>
            <td>密码</td>
            <td><input type="password" placeholder="请输入密码"></td>
          </tr>
          <tr>
            <td>重复密码</td>
            <td><input type="password" placeholder="请重新输入密码"></td>
          </tr>
          <tr>
            <td>性别</td>
            <td><input type="radio" name="gender">男
              <input type="radio" name="gender">女
            </td>
          </tr>
          <tr>
            <td>爱好</td>
            <td>
              <input type="checkbox" name="hobby">阅读
              <input type="checkbox" name="hobby">运动
              <input type="checkbox" name="hobby">烹饪
              <br>
              <input type="checkbox" name="hobby">音乐
              <input type="checkbox" name="hobby">跳舞
              <input type="checkbox" name="hobby">旅游
            </td>
          </tr>
          <tr>
            <td>出生年月</td>
            <td>
              <input type="date" name="" id="">
            </td>
          </tr>
          <tr>
            <td>身高</td>
            <td>
              <input type="number" name="" id="">
            </td>
          </tr>
          <tr>
            <td>简介</td>
            <td>
              <textarea name="" id="" rows="4" cols="30"></textarea>
            </td>
          </tr>
          <tr>
            <td>个人照片</td>
            <td>
              <input type="file" name="" id="">
            </td>
          </tr>
          <tr>
            <td>
              <input type="submit" value="提交">

            </td>
            <td>
              <input type="reset" value="重置">
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
</body>
</html>
