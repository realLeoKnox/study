<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    div{
      width: 220px;
      height: 100px;
      background-color: #777;
      margin-bottom: 10px;
      font-size: 36px;
    }
    .d1{
      border-top: 1px solid #f00;
      padding: 15px;
      margin-top: 30px;
    }
    .d2{
      border-left: 4px dashed #f00;
      border-right: 4px dashed #f00;
      padding-left: 15px;
      margin-left: 30px;
    }
    .d3{
      border: 4px dotted #ff0000;
    }
    .d4{
      border: 4px double #f00;
      border-radius: 10px;
    }
    .d5{
      border-radius: 100px/50px;
    }
  </style>
</head>
<body>

<div class="d1">div</div>
<div class="d2">div</div>
<div class="d3">div</div>
<div class="d4">div</div>
<div class="d5">div</div>
</body>
</html>
